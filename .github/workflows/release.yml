name: 'Publish Release'

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the release once every platform has uploaded'
        type: boolean
        default: true

jobs:
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create_release.outputs.id }}
    steps:
      - uses: actions/checkout@v4
      - name: Create Draft Release
        id: create_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(grep '^version' src-tauri/Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          fi
          # Re-runnable: reuse the release if it already exists (draft or published).
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq ".[] | select(.tag_name == \"v$VERSION\") | .id" | head -1)
          if [ -z "$id" ]; then
            # Take the id from the create response: the release list can lag behind.
            id=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="v$VERSION" \
              -f target_commitish="$GITHUB_SHA" \
              -f name="Google Chat Desktop v$VERSION" \
              -f body="See the assets to download this version and install." \
              -F draft=true --jq .id)
          fi
          # tauri-action needs the numeric REST id, not the GraphQL node id.
          test -n "$id"
          echo "id=$id" >> "$GITHUB_OUTPUT"

  publish-tauri:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
          - platform: 'ubuntu-latest'
          - platform: 'windows-latest'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf

      - name: install node dependencies
        run: npm ci

      - name: build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}

      # Arch package: repackage the .deb built above (no container, no rebuild,
      # works for tag and manual runs alike).
      - name: build and upload Arch package (ubuntu only)
        if: matrix.platform == 'ubuntu-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sudo apt-get install -y zstd
          VERSION=$(grep '^version' src-tauri/Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          DEB=$(ls src-tauri/target/release/bundle/deb/*.deb | head -1)
          .github/scripts/arch-package.sh "$VERSION" "$DEB" arch-out
          # Upload by release id: a draft has no tag yet, so tag lookups can miss it.
          ID="${{ needs.create-release.outputs.release_id }}"
          for f in arch-out/*.pkg.tar.zst arch-out/PKGBUILD; do
            name=$(basename "$f")
            old=$(gh api "repos/$GITHUB_REPOSITORY/releases/$ID/assets" --paginate \
              --jq ".[] | select(.name == \"$name\") | .id")
            [ -n "$old" ] && gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$old"
            gh api -X POST "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$ID/assets?name=$name" \
              -H "Content-Type: application/octet-stream" --input "$f" --jq .browser_download_url
          done

  publish-release:
    needs: [create-release, publish-tauri]
    if: github.event_name == 'push' || inputs.publish
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ID="${{ needs.create-release.outputs.release_id }}"
          DRAFT=$(gh api "repos/$GITHUB_REPOSITORY/releases/$ID" --jq .draft)
          if [ "$DRAFT" = "true" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$ID" \
              -F draft=false -f make_latest=true --jq .html_url
          else
            echo "Release $ID is already published."
          fi

