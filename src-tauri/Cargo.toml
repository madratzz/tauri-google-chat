[package]
name = "google-chat-desktop"
version = "1.3.29905200"
description = "A Tauri desktop wrapper for Google Chat"
authors = ["madratzz"]
edition = "2021"
rust-version = "1.80"

[lib]
name = "google_chat_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
tauri = { version = "2", features = ["devtools", "image-png", "tray-icon", "unstable"] }
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"

# Smaller, faster release binaries: whole-program optimisation, stripped symbols.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
